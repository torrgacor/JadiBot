# ================================================================
# NGINX CONFIG — NANO GATEWAY
# Domain : wagetway.danznanooffc.my.id
# Proxy  : http://127.0.0.1:3005 (NANO GATEWAY web app)
#
# Install:
#   sudo cp deploy/nginx-wagetway.danznanooffc.my.id.conf \
#          /etc/nginx/sites-available/wagetway.conf
#   sudo ln -sf /etc/nginx/sites-available/wagetway.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wagetway.danznanooffc.my.id   # HTTPS
#
# SSL is issued by certbot, which rewrites this block in place to add
# the 443 listener and the certificate paths.
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wagetway.danznanooffc.my.id;

    # Let certbot answer the ACME challenge on this domain.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Media and CSV imports are the largest things a user can post.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Upgrade is what lets the realtime stream stay open through the proxy.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;

        # ── Server-Sent Events ───────────────────────────────────────────
        # /api/realtime holds one long-lived response open. Buffering would
        # delay every live dashboard update, and a short read timeout would
        # drop the stream as soon as the bot goes quiet.
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        chunked_transfer_encoding on;
    }
}
